    name: "个股新闻搜索"
    desc: "按代码搜索个股相关新闻：标题/摘要/时间/媒体名/URL（JSONP 剥壳）"
    upstream: "东财 search-api-web.eastmoney.com/search/jsonp (type=cmsArticleWebOld)"
