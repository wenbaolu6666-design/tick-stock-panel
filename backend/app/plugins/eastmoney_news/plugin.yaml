# TSP built-in news source via EastMoney public search API.
name: eastmoney_news
display_name: "东财新闻"
runtime: none
entry: app.plugins.eastmoney_news.provider:EastmoneyNewsProvider
check: app.plugins.eastmoney_news.provider:availability
datasets: [news]
description: "东方财富个股新闻搜索（search-api-web），无需API Key。"
homepage: "https://so.eastmoney.com/"
