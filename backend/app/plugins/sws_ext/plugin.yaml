# TSP built-in SWS plugin — 申万行业变迁史 (StockClassifyUse_stock.xls)。
# 上游: www.swsresearch.com/swindex/pdf/SwClass2021/StockClassifyUse_stock.xls (12910 行)。
name: sws_ext
display_name: "申万行业变迁"
runtime: python
entry: app.plugins.sws_ext.provider:SwsExtProvider
check: app.plugins.sws_ext.provider:availability
datasets: [sector]
description: "申万行业分类历次调整全表（股票代码/计入日期/行业代码/更新日期）：按计入-退出区间取历史时点归属，消除前视偏差。零 Key。"
install_hint: "uv pip install --python backend/.venv/Scripts/python.exe xlrd"
homepage: "https://www.swsresearch.com/"
inventory:
  - dataset: sector
    name: "申万行业变迁史"
    desc: "每股历次申万行业调整记录；支持 as_of 时点查询（计入≤t<退出）"
    upstream: "申万研究所 www.swsresearch.com/swindex/pdf/SwClass2021/StockClassifyUse_stock.xls"
